<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML GRAPHICS</title>
    <link rel="icon" type="image/png" href="bird_logo.png" />
    `
  </head>
  <body>
    <svg width="300" height="120" style="display: block; margin: 10px 0">
      <circle
        cx="150"
        cy="60"
        r="40"
        fill="tomato"
        stroke="#333"
        stroke-width="2"
      />
      <text
        x="150"
        y="120"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
      >
        1. Circle
      </text>
    </svg>

    <svg width="300" height="120" style="display: block; margin: 10px 0">
      <rect
        x="80"
        y="30"
        width="140"
        height="60"
        fill="blue"
        stroke="#333"
        stroke-width="2"
      />
      <text
        x="150"
        y="110"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
      >
        2. Rectangle
      </text>
    </svg>

    <svg width="300" height="120" style="display: block; margin: 10px 0">
      <ellipse
        cx="150"
        cy="60"
        rx="80"
        ry="40"
        fill="
        green"
        stroke="#333"
        stroke-width="2"
      />
      <text
        x="150"
        y="120"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
      >
        3. Ellipse
      </text>
    </svg>

    <svg width="300" height="40" style="display: block; margin: 10px 0">
      <line x1="80" y1="20" x2="220" y2="20" stroke="#333" stroke-width="3" />
      <text
        x="150"
        y="40"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
      >
        4. Line
      </text>
    </svg>

    <svg width="300" height="120" style="display: block; margin: 10px 0">
      <polygon
        points="150,30 160,60 190,60 165,80 175,110 150,90 125,110 135,80 110,60 140,60"
        fill="gold"
        stroke="#333"
        stroke-width="1"
      />
      <text
        x="150"
        y="140"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
      >
        5. Star
      </text>
    </svg>

    <svg width="300" height="100" style="display: block; margin: 10px 0">
      <image href="bird_logo.png" x="80" y="20" width="140" height="60" />
      <text
        x="150"
        y="100"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
      >
        6. Static Image
      </text>
    </svg>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/HD13eq_Pmp8?si=Iqof_PQXdYq_BdlO"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
